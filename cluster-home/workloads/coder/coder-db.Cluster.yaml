apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: coder-db
  namespace: coder
spec:
  # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4
  instances: 1
  bootstrap:
    initdb:
      database: coder
      owner: coder
      secret:
        name: coder-db
  storage:
    size: 5Gi
    storageClass: pve-nvme-wd-red
