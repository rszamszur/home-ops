apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: kutt-db
  namespace: url-shortener
spec:
  # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4
  instances: 1
  bootstrap:
    initdb:
      database: kutt
      owner: kutt
      secret:
        name: kutt-db
  storage:
    size: 5Gi
    storageClass: pve-nvme-wd-red
